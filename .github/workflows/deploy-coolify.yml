name: Deploy (Coolify webhook)

on:
  push:
    branches:
      - main
      - develop

concurrency:
  group: deploy-coolify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy production
        if: github.ref == 'refs/heads/main'
        env:
          URL: ${{ vars.DEPLOY_HOOK_URL_PRODUCTION }}
          BEARER: ${{ secrets.DEPLOY_HOOK_BEARER }}
        run: |
          set -eu
          if [ -z "${URL:-}" ]; then
            echo "Missing repository variable DEPLOY_HOOK_URL_PRODUCTION (Settings → Secrets and variables → Actions → Variables)." >&2
            exit 1
          fi
          if [ -z "${BEARER:-}" ]; then
            echo "Missing repository secret DEPLOY_HOOK_BEARER." >&2
            exit 1
          fi
          curl -fsS --max-time 120 -X POST "$URL" \
            -H "Authorization: Bearer ${BEARER}" \
            -H "Accept: application/json"

      - name: Deploy staging
        if: github.ref == 'refs/heads/develop'
        env:
          URL: ${{ vars.DEPLOY_HOOK_URL_STAGING }}
          BEARER: ${{ secrets.DEPLOY_HOOK_BEARER }}
          BASIC: ${{ secrets.STAGING_BASIC_AUTH_CURL }}
        run: |
          set -eu
          if [ -z "${URL:-}" ]; then
            echo "Missing repository variable DEPLOY_HOOK_URL_STAGING (Settings → Secrets and variables → Actions → Variables)." >&2
            exit 1
          fi
          if [ -z "${BEARER:-}" ]; then
            echo "Missing repository secret DEPLOY_HOOK_BEARER." >&2
            exit 1
          fi
          CURL_BASIC=( )
          if [ -n "${BASIC:-}" ]; then
            CURL_BASIC=( -u "${BASIC}" )
          fi
          curl -fsS --max-time 120 -X POST "${CURL_BASIC[@]}" "$URL" \
            -H "Authorization: Bearer ${BEARER}" \
            -H "Accept: application/json"
