name: Deploy (Coolify webhook)

on:
  push:
    branches:
      - main
      - develop

concurrency:
  group: deploy-coolify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy production
        if: github.ref == 'refs/heads/main'
        env:
          URL: ${{ vars.DEPLOY_HOOK_URL_PRODUCTION }}
          BEARER: ${{ secrets.DEPLOY_HOOK_BEARER }}
        run: |
          set -eu
          URL="$(printf '%s' "$URL" | tr -d '\r')"
          URL="${URL#"${URL%%[![:space:]]*}"}"
          URL="${URL%"${URL##*[![:space:]]}"}"
          if [ -z "$URL" ]; then
            echo "Missing or blank DEPLOY_HOOK_URL_PRODUCTION." >&2
            echo "Create it under Settings → Secrets and variables → Actions → Variables (not Secrets)." >&2
            exit 1
          fi
          case "$URL" in
            https://*) ;;
            *)
              echo "DEPLOY_HOOK_URL_PRODUCTION must start with https:// (got malformed value)." >&2
              exit 1
              ;;
          esac
          if [ -z "${BEARER:-}" ]; then
            echo "Missing repository secret DEPLOY_HOOK_BEARER." >&2
            exit 1
          fi
          curl -fsS --max-time 120 -X POST "$URL" \
            -H "Authorization: Bearer ${BEARER}" \
            -H "Accept: application/json"

      - name: Deploy staging
        if: github.ref == 'refs/heads/develop'
        env:
          URL: ${{ vars.DEPLOY_HOOK_URL_STAGING }}
          BEARER: ${{ secrets.DEPLOY_HOOK_BEARER }}
        run: |
          set -eu
          URL="$(printf '%s' "$URL" | tr -d '\r')"
          URL="${URL#"${URL%%[![:space:]]*}"}"
          URL="${URL%"${URL##*[![:space:]]}"}"
          if [ -z "$URL" ]; then
            echo "Missing or blank DEPLOY_HOOK_URL_STAGING." >&2
            echo "Create it under Settings → Secrets and variables → Actions → Variables (not Secrets)." >&2
            exit 1
          fi
          case "$URL" in
            https://*) ;;
            *)
              echo "DEPLOY_HOOK_URL_STAGING must start with https:// (got malformed value)." >&2
              exit 1
              ;;
          esac
          if [ -z "${BEARER:-}" ]; then
            echo "Missing repository secret DEPLOY_HOOK_BEARER." >&2
            exit 1
          fi
          curl -fsS --max-time 120 -X POST "$URL" \
            -H "Authorization: Bearer ${BEARER}" \
            -H "Accept: application/json"
